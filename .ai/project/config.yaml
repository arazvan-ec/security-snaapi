# Project Configuration
# Generated by ai_consultant.py or manually configured
# Last updated: 2026-01-16

project:
  name: "SNAAPI"
  type: "api-gateway"
  description: "API Gateway that aggregates content from multiple microservices for mobile apps"

# Backend configuration
backend:
  enabled: true
  path: "./snaapi"              # Relative path to backend
  framework: "symfony"          # Symfony 6.4
  language: "php"               # PHP 8.1+
  architecture: "hexagonal+cqrs" # Hexagonal + CQRS (Query side)
  test_framework: "phpunit"     # PHPUnit 10

# Frontend configuration
frontend:
  enabled: false                # Set to true if frontend is needed
  location: "same"              # "same" = same project, "separate" = different repo
  path: ""                      # Relative path if same project, absolute if separate
  framework: ""                 # react, vue, angular, svelte, etc.
  ui_library: ""                # tailwind, material-ui, chakra, etc.
  test_framework: ""            # jest, vitest, cypress, playwright, etc.

# Database configuration
database:
  enabled: false
  type: ""                      # postgresql, mysql, mongodb, sqlite, etc.
  orm: ""                       # doctrine, eloquent, prisma, typeorm, etc.

# Workflow preferences
workflow:
  default: "task-breakdown"     # Default workflow to suggest
  auto_detect_complexity: true
  parallel_execution: true      # Enable backend/frontend parallel work
  api_mocking: true             # Enable API mocking when backend not ready

# Capability providers (auto-detect model and select best implementation)
# See: plugins/multi-agent-workflow/core/providers.yaml for full configuration
# See: plugins/multi-agent-workflow/core/docs/CAPABILITY_PROVIDERS.md for documentation
providers:
  config_path: "plugins/multi-agent-workflow/core/providers.yaml"

# Git configuration
git:
  main_branch: "main"
  feature_branch_prefix: "feature/"
  commit_style: "conventional"  # conventional, simple, etc.

# AI Analysis Results
ai_analysis:
  last_analyzed: "2026-02-09"

  detected:
    project_type: "backend-only"
    frameworks: ["symfony-6.4"]
    package_managers: ["composer"]
    has_tests: true
    has_ci: true
    has_docker: true

  complexity:
    level: "high"
    factors:
      - "Chain of Responsibility orchestration pattern"
      - "7 external microservice clients (editorial, multimedia, section, journalist, membership, tag, widget)"
      - "Async messaging via RabbitMQ/Symfony Messenger"
      - "Compiler passes for dynamic service registration"
      - "PHPStan level 9 + mutation testing"
    estimated_effort: "> 3 days"

  recommendations:
    workflow: "task-breakdown"
    workflow_reasoning: "High complexity API gateway with multiple bounded contexts requires detailed planning"
    architecture: "hexagonal+cqrs"
    suggestions:
      - "Use task-breakdown workflow for new features"
      - "Follow existing Chain of Responsibility pattern for new orchestrators"
      - "Add DataTransformer + Compiler pass for new content types"
      - "Maintain 79% MSI threshold in mutation testing"

  patterns:
    backend:
      - {name: "Chain of Responsibility", path: "snaapi/src/Orchestrator/", description: "Request routing by content type"}
      - {name: "Strategy Pattern", path: "snaapi/src/Application/DataTransformer/", description: "Type-specific data transformation"}
      - {name: "Compiler Pass", path: "snaapi/src/DependencyInjection/Compiler/", description: "Dynamic service registration via tags"}
      - {name: "Bounded Context Client", path: "snaapi/src/Ec/", description: "External microservice HTTP clients"}
    frontend: []

# Feature templates
features:
  # Directory for feature artifacts
  directory: ".ai/project/features"

  # Required documents for task-breakdown
  task_breakdown_docs:
    - "00_requirements_analysis.md"
    - "10_architecture.md"
    - "15_data_model.md"
    - "20_api_contracts.md"
    - "30_tasks_backend.md"
    - "31_tasks_frontend.md"
    - "32_tasks_qa.md"
    - "35_dependencies.md"
    - "50_state.md"

  # Required documents for default workflow
  default_docs:
    - "FEATURE_X.md"
    - "30_tasks.md"
    - "50_state.md"

# Context management
context:
  # Context file for AI awareness
  context_file: ".ai/project/context.md"

  # Auto-refresh context on each session
  auto_refresh: true

  # Checkpointing settings
  checkpointing:
    enabled: true
    max_session_messages: 50    # Suggest restart after this many messages
    max_files_read: 20          # Suggest restart after reading this many files
    checkpoint_on_complete: true # Auto-checkpoint when task completes

# Metadata
metadata:
  created: ""
  updated: ""
  created_by: "ai_consultant.py"
  version: "2.0"                # Config schema version
